<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Sagar's Portfolio</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0a0a0a;
            font-family: 'Arial', sans-serif;
            color: white;
            overflow: hidden;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: float 15s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }

        .content {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .welcome-text {
            font-size: 3rem;
            margin-bottom: 1rem;
            font-weight: bold;
            background: linear-gradient(45deg, #3498db, #2ecc71, #e74c3c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradient 3s ease infinite;
            background-size: 200% 200%;
        }

        .typing-text {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: #3498db;
            height: 1.5em;
        }

        .cursor {
            display: inline-block;
            width: 3px;
            height: 1em;
            background-color: #3498db;
            margin-left: 2px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .enter-button {
            padding: 15px 40px;
            font-size: 1.2rem;
            background: linear-gradient(45deg, #3498db, #2ecc71);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .enter-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(52, 152, 219, 0.5);
        }

        .enter-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.2),
                transparent
            );
            transition: 0.5s;
        }

        .enter-button:hover::before {
            left: 100%;
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    <div class="content">
        <h1 class="welcome-text">Welcome to Sagar Singh Meena's Portfolio</h1>
        <div class="typing-text" id="typing-text"></div>
        <a href="portfolio.html" class="enter-button">Enter Portfolio</a>
    </div>

    <script>
        // Create particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 50; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.animationDelay = Math.random() * 15 + 's';
            particlesContainer.appendChild(particle);
        }

        // Typing effect
        const text = "Python-Fullstack Developer";
        const typingText = document.getElementById('typing-text');
        let i = 0;
        
        function typeWriter() {
            if (i < text.length) {
                typingText.innerHTML = text.substring(0, i + 1) + '<span class="cursor"></span>';
                i++;
                setTimeout(typeWriter, 100);
            } else {
                typingText.innerHTML = text + '<span class="cursor"></span>';
            }
        }

        // Start typing effect
        setTimeout(typeWriter, 1000);

        // Auto-redirect after 10 seconds
        setTimeout(() => {
            window.location.href = 'portfolio.html';
        }, 10000);
    </script>
</body>
</html>
